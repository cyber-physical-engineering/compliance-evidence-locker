[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compliance-evidence-locker"
version = "0.1.0"
description = "Keeps audit events in a SHA-256 hash chain and tags them with 21 CFR Part 11 §11.10 controls for an auditor's review."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "James Thornton"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
evidence-locker = "evidence_locker.cli.main:app"

[project.urls]
Homepage = "https://github.com/cyber-physical-engineering/compliance-evidence-locker"
Documentation = "https://github.com/cyber-physical-engineering/compliance-evidence-locker#readme"
Repository = "https://github.com/cyber-physical-engineering/compliance-evidence-locker"
Issues = "https://github.com/cyber-physical-engineering/compliance-evidence-locker/issues"

[tool.hatch.build.targets.wheel]
packages = ["evidence_locker"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true

