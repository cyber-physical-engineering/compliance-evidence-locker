[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compliance-evidence-locker"
version = "0.1.0"
description = "Automated generation of immutable audit evidence from Trust Stack logs."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Big Data Plumbing", email = "contact@bigdataplumbing.io"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Office/Business :: Financial :: Accounting",
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "typer>=0.9.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
evidence-locker = "evidence_locker.cli.main:app"

[project.urls]
Homepage = "https://github.com/bigdataplumbing/compliance-evidence-locker"
Documentation = "https://github.com/bigdataplumbing/compliance-evidence-locker#readme"
Repository = "https://github.com/bigdataplumbing/compliance-evidence-locker"
Issues = "https://github.com/bigdataplumbing/compliance-evidence-locker/issues"

[tool.hatch.build.targets.wheel]
packages = ["evidence_locker"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true

